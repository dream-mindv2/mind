# `mind`, the build tool. build.dr beside this declares the checks against
# packages on disk that `mind test mind` runs after the units.
[package]
license = "MIT OR Apache-2.0"
name = "mind"
version = "0.3.4"
repository = "https://github.com/dream-mindv2/mind"
description = "The Dream build tool"

# `mind release`: `mind --version` prints the version from the source too.
[release]
files = ["src/main.dr"]
